        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetProfileFunction.Arn}/invocations
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SignupMethod
      - GoogleSignInMethod
      - LoginMethod
      - LinkGoogleCalendarMethod
      - CreateEventMethod
      - GetEventsMethod
      - GetEventMethod
      - UpdateStateMethod
      - AddToCalendarMethod
      - GetMyEventsMethod
      - GetPublicEventsMethod
      - CreateTicketMethod
      - PurchaseTicketMethod
      - VerifyPurchaseMethod
      - GetTicketSalesMethod
      - CreateShareMethod
      - GetSharesMethod
      - ConfirmAttendanceMethod
      - CreateDonationMethod
      - VerifyDonationMethod
      - GetUploadUrlMethod
      - ScanQRMethod
      - UpdateProfileMethod
      - GetProfileMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
