      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref PaystackWebhookResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaystackWebhookFunction.Arn}/invocations
  AccountVerifyResource:
